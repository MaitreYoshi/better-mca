plugins {
    id 'dev.architectury.loom' version '1.17.477'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    maven { url = "https://maven.architectury.dev/" }
}

loom {
    runs {
        client {
            programArgs "--username", "Dev"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_version}"

    // Minecraft Comes Alive
    modImplementation files(project.mca_jar)
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.register('treeLayoutCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.maitreyoshi.mcavie.tree.client.TreeLayoutCheck'
    args System.getProperty('treeSvg', "${buildDir}/tree-svg")
}

tasks.register('treeSelectionCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.maitreyoshi.mcavie.tree.TreeSelectionCheck'
}

tasks.register('treeRealCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.maitreyoshi.mcavie.tree.client.TreeRealCheck'
    ['treeData', 'treeRoot', 'treeSvg', 'treeShown', 'treeEvery'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
    if (System.getProperty('treeSvg') == null) {
        systemProperty 'treeSvg', "${buildDir}/tree-real-svg"
    }
}

tasks.named('check') {
    dependsOn 'treeLayoutCheck'
    dependsOn 'treeSelectionCheck'
}

tasks.register('familyAgesCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.maitreyoshi.mcavie.life.FamilyAgesCheck'
}
